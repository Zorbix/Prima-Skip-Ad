<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prímový Skip Ad — doplněk do prohlížeče umožňující automatické přeskakování reklam na webu populární české IPTV. Stáhnout pro Chrome a Firefox.">
  <title>Prímový Skip Ad</title>
  <link rel="icon" type="image/svg+xml" href="images/primovy-skip-ad.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze:wght@400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
  <section class="project" aria-labelledby="project-title">
    <h1 id="project-title">Prímový Skip Ad</h1>
    <img class="project-image" src="images/primovy-skip-ad.svg" alt="Logo Prímový Skip Ad — číslo 60 s kruhovou šipkou" width="240" height="240">
    <p class="project-description">Doplněk do prohlížeče umožňující automatické přeskakování reklam na webu populární české IPTV.</p>
    <div class="browser-links" aria-label="Stáhnout doplněk pro prohlížeč">
      <a class="browser-link" href="https://chromewebstore.google.com/detail/prima-skip-ad/nbfjjcajjpfkiccigakjkgpmbbbafldm?hl=en" target="_blank" rel="noopener noreferrer" title="Prímový Skip Ad v Chrome Web Store"><img src="images/chrome.svg" width="32" height="32" alt=""><span>Chrome</span></a>
      <a class="browser-link" href="https://addons.mozilla.org/cs/firefox/addon/pr%C3%ADmov%C3%BD-skip-ad/" target="_blank" rel="noopener noreferrer" title="Prímový Skip Ad pro Firefox"><img src="images/firefox.svg" width="32" height="32" alt=""><span>Firefox</span></a>
    </div>
  </section>
  <img class="extension-preview" src="images/extension-preview.png" alt="Ukázka Prímového Skip Ad: automatické přeskočení reklamního bloku a ruční posun videa o 60 sekund." width="800" height="500">
  </main>
</body>
</html>

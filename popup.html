<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>Prima Skip Ad</title>
<link rel="stylesheet" href="popup.css"><script src="ad-skip.js" defer></script><script src="popup.js" defer></script></head>
<body>
<h1>Prima Skip Ad</h1>
<label for="seconds">Posun dopředu (sekundy)</label>
<div class="controls">
<button id="minus" aria-label="Ubrat 60 sekund" disabled>−60</button>
<input id="seconds" type="number" min="0" step="1" value="60" disabled>
<button id="plus" aria-label="Přidat 60 sekund" disabled>+60</button>
</div>
<button id="skip" disabled>Posunout o 60 s</button>
<p id="status" role="status" aria-live="polite"></p>
<label class="auto-option"><input id="auto-skip" type="checkbox" disabled> Automaticky přeskočit reklamní blok</label>
<p class="hint">Oneplay: při zákazu přetáčení skočí na známý konec reklam. Platí pro tuto kartu do obnovení stránky.</p>
<p id="auto-status" role="status" aria-live="polite"></p>
</body></html>

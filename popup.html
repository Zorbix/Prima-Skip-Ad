<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>Prímový Skip Ad</title>
<link rel="stylesheet" href="popup.css"><script src="ad-skip.js" defer></script><script src="popup.js" defer></script></head>
<body>
<h1>Prímový Skip Ad</h1>
<label class="auto-option">
  <span>Automaticky přeskočit reklamní blok</span>
  <span class="switch">
    <input id="auto-skip" type="checkbox" role="switch" disabled>
    <span class="switch-track" aria-hidden="true"></span>
  </span>
</label>
<p class="hint">Na programech se zákazem přetáčení skočí na známý konec reklam.</p>
<p id="auto-status" role="status" aria-live="polite"></p>
<div class="manual-skip">
<label for="seconds">Posun dopředu (sekundy)</label>
<div class="controls">
<button id="minus" aria-label="Ubrat 15 sekund" disabled>−15</button>
<input id="seconds" type="number" min="0" step="1" value="60" disabled>
<button id="plus" aria-label="Přidat 60 sekund" disabled>+60</button>
</div>
<button id="skip" disabled>Posunout o 60 s</button>
<p id="status" role="status" aria-live="polite"></p>
</div>
</body></html>
